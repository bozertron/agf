<!doctype html>
<html lang="en" data-theme="midnight"><head><link rel="stylesheet" href="../../agf.css"><meta charset="utf-8"><title>Certificate — preview</title></head>
<body>

<div style="padding:var(--space-32);background:var(--surface-raised);display:flex;justify-content:center">
<div class="agf-deep" data-theme="midnight" style="width:640px;padding:var(--space-32) var(--space-48);border:2px solid var(--brass);outline:1px solid var(--brass-hairline);outline-offset:4px;border-radius:var(--radius-2);position:relative">
  <div style="display:flex;justify-content:space-between;align-items:flex-start"><div class="agf-wordmark"><span class="agf-wordmark__mark" style="font-size:40px">AGF</span></div><svg width="40" height="40" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" fill="none" stroke-linecap="round" role="img" aria-label="Floating ground"><g stroke="#D4A234" stroke-width="1"><path d="M46.25 4.55A36 36 0 1 1 6.17 52.31"/><path d="M4.55 33.75A36 36 0 0 1 27.69 6.17"/></g><g stroke="#B8860B" stroke-width="2"><line x1="40" y1="22" x2="40" y2="40"/><line x1="24" y1="40" x2="56" y2="40"/><line x1="29" y1="47" x2="51" y2="47"/><line x1="34" y1="54" x2="46" y2="54"/></g></svg></div>
  <p class="agf-strapline" style="font-size:28px;letter-spacing:.2em;color:var(--brass-glow);margin-top:var(--space-24)">Measured in silence.</p>
  <p class="agf-caption" style="color:var(--ink-on-deep-muted);margin-top:var(--space-8)">Calibration certificate · AGF // FIELD · F-1 preamplifier · № F1-00017</p>
  <table class="agf-spec" style="margin-top:var(--space-24)"><tbody>
    <tr><th>Noise floor</th><td>-131.5 <span class="u">dBV</span></td><td>150 Ω, A-wt</td></tr>
    <tr><th>THD+N</th><td>0.00028 <span class="u">%</span></td><td>1 kHz, +4 dBu</td></tr>
    <tr><th>Channel match</th><td>0.02 <span class="u">dB</span></td><td>20 Hz-20 kHz</td></tr>
  </tbody></table>
  <div style="display:flex;justify-content:space-between;margin-top:var(--space-24)"><p class="agf-caption" style="color:var(--ink-on-deep-muted)">Measured by hand, 14 March 2026</p><p class="agf-strapline agf-strapline--small" style="color:var(--brass)">E. Okafor</p></div>
</div></div>
</body></html>
