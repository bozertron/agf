<!doctype html>
<html lang="en" data-theme="midnight"><head><link rel="stylesheet" href="../../agf.css"><meta charset="utf-8"><title>Wordmark — preview</title></head>
<body>

<div style="display:grid;grid-template-columns:1fr 1fr;min-height:232px">
  <div class="agf-deep" data-theme="midnight" style="display:flex;align-items:center;justify-content:center;padding:var(--space-32)">
    <div class="agf-wordmark agf-wordmark--lg"><span class="agf-wordmark__mark">AGF</span><span class="agf-wordmark__strap"><span>All</span><span>Grounds</span><span>Floating</span></span></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:var(--space-32);align-items:flex-start;justify-content:center;padding:var(--space-32);background:var(--surface-raised)">
    <div class="agf-wordmark"><span class="agf-wordmark__mark">AGF</span><span class="agf-wordmark__strap"><span>All</span><span>Grounds</span><span>Floating</span></span></div>
    <div style="display:flex;gap:var(--space-32);align-items:center"><div class="agf-wordmark agf-wordmark--sm"><span class="agf-wordmark__mark">AGF</span></div><div class="agf-wordmark agf-wordmark--sm agf-wordmark--ink"><span class="agf-wordmark__mark">AGF</span></div></div>
  </div>
</div>
</body></html>
