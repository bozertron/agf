<!doctype html>
<html lang="en" data-theme="midnight"><head><link rel="stylesheet" href="../../agf.css"><meta charset="utf-8"><title>Input — preview</title></head>
<body>

<div class="agf-row" style="align-items:flex-start;gap:var(--space-32)">
  <label class="agf-field"><span class="agf-label">Session name</span><input class="agf-input" placeholder="Room 2 — Strings, take 4"><span class="agf-hint">Shown on the recorder display.</span></label>
  <label class="agf-field"><span class="agf-label">Sample rate</span><select class="agf-input"><option>96 kHz</option><option>48 kHz</option><option>192 kHz</option></select></label>
  <label class="agf-field is-invalid"><span class="agf-label">Serial number</span><input class="agf-input" value="AGF-F1-" aria-invalid="true"><span class="agf-hint">Eight characters after the model code.</span></label>
</div>
</body></html>
